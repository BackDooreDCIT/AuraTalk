<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/each_lesson.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <title>Lesson</title>
</head>
<body>
    <div class="nav">
        <div class="logo">
            <h4>AuraTalk</h4>
        </div>
        <div class="mid">
            <a href="/patient/" id="home">หน้าหลัก</a>
            <a href="/patient/mission" id="mission">ภารกิจ</a>
            <a href="/patient/timer/" id="timer">ฝึกหายใจ</a>
        </div>
        <div class="las">
            <a href="/patient/profile">
                <div class="at-avatar at-avatar-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
            </a>
            <a href="/logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
        </div>
    </div>
    <div class="main">
    <div class="top">
        <a href="/patient/"><i class="fa-solid fa-chevron-left"></i></a>
         <a href="/patient/"><h2>แบบฝึกหัดของคุณ</h2></a>
    </div>
        {% for item in lessons %}
            {% if item.assignment.isdone %}
                <div class="node locked">
                    <div class="icon-tile"><i class="fa-solid fa-check"></i></div>
                    <h3>{{ item.activity.activityname }}</h3>
                </div>
            {% else %}
                <a href="/patient/activity/{{ item.activity.activityid }}?assignment_id={{ item.assignment.assignmentid }}&templateid={{ item.assignment.templateid }}">
                    <div class="node">
                        <div class="icon-tile"><i class="fa-solid fa-headphones-simple"></i></div>
                        <h3>{{ item.activity.activityname }}</h3>
                    </div>
                </a>
            {% endif %}
        {% endfor %}
    </div>

    <div class="at-bottom-nav">
        <a href="/patient/mission"><i class="fa-solid fa-rocket"></i>ภารกิจ</a>
        <a href="/patient/" class="at-active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
        <a href="/patient/profile"><i class="fa-solid fa-user"></i>โปรไฟล์</a>
    </div>
</body>
</html>
