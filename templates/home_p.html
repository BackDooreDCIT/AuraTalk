<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/home_p.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <title>Home</title>
</head>

<body>
    <div class="nav">
        <div class="logo">
            <h4>AuraTalk</h4>
        </div>
        <div class="mid">
            <a href="/slp/" id="home" class="at-active">หน้าหลัก</a>
        </div>
        <div class="las">
            <a href="/slp/profile" title="โปรไฟล์ของฉัน">
                <div class="at-avatar at-avatar-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
            </a>
            <a href="/logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </div>

    <div class="main">
        <div class="at-page-head">
            <h2>แบบฝึกหัดทั้งหมด</h2>
            <a href="/slp/addnewpatient" class="at-btn-primary">
                <i class="fa-solid fa-user-plus"></i>
                เพิ่มผู้ป่วยใหม่
            </a>
        </div>
        <div class="at-lesson-grid">
            {% for lesson in lesson_types %}
            <a href="/slp/profile">
                <div class="at-lesson-card">
                    <div class="at-lesson-icon"><i class="fa-solid {{ lesson.icon }}"></i></div>
                    <h4>{{ lesson.name }}</h4>
                    <p>เลือกผู้ป่วยเพื่อมอบหมาย</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

    <div class="at-bottom-nav">
        <a href="/slp/" class="at-active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
        <a href="/slp/profile"><i class="fa-solid fa-user"></i>โปรไฟล์</a>
    </div>
</body>

</html>
